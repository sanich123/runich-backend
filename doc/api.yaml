openapi: 3.0.3
info:
  title: Runich API endpoint inventory
  description: >-
    The endpoint inventory for the Runich backend. Swagger at /api is the
    authoritative source for request and response schemas.
  version: 1.0.0
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /auth/config:
    get:
      summary: Get application configuration
      security: []
  /auth/register:
    post:
      summary: Register a user
      security: []
  /auth/login:
    post:
      summary: Log in
      security: []
  /auth/by-email-link:
    post:
      summary: Send a passwordless login link
      description: >-
        Sends a passwordless login link to an existing user's email address.
        The link contains a short-lived access token and does not require
        authentication on this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: User email address
      responses:
        '200':
          description: Login link sent
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Login link sent to the specified email address
  /auth/refresh:
    post:
      summary: Refresh access token
      security: []
  /auth/verify:
    post:
      summary: Exchange one-time login code for session tokens
      security: []
  /auth/confirm-email:
    post:
      summary: Confirm email address
      security: []
  /auth/get-email-code-for-password:
    post:
      summary: Send password change code
      security: []
  /auth/verify-password-change-code:
    post:
      summary: Verify password change code
      security: []
  /auth/change-password:
    post:
      summary: Change password
      security: []
  /auth/{userId}:
    delete:
      summary: Delete a user account
      parameters:
        - $ref: '#/components/parameters/UserId'
  /user/{id}/profile:
    get:
      summary: Get a user profile
      parameters:
        - $ref: '#/components/parameters/Id'
    post:
      summary: Create a user profile
      parameters:
        - $ref: '#/components/parameters/Id'
    patch:
      summary: Update a user profile
      parameters:
        - $ref: '#/components/parameters/Id'
  /photo:
    post:
      summary: Upload a photo or video for the authenticated user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                scope:
                  type: string
                  enum: [activity, profile, feedback]
                  default: activity
                feedbackId:
                  type: string
                  format: uuid
    delete:
      summary: Delete an uploaded photo or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
  /profile/filter:
    get:
      summary: Search profiles
  /activity/{id}/photos:
    get:
      summary: Get activity photos for a user
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Take'
  /activity/{id}/locations:
    get:
      summary: Get locations for an activity
      parameters:
        - $ref: '#/components/parameters/Id'
  /activity/activityIds:
    get:
      summary: Get activities by ids
      parameters:
        - $ref: '#/components/parameters/Ids'
  /activity/migration-strava/{id}:
    post:
      summary: Import activities from a Strava archive
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Migration queued; poll the returned jobId for progress
  /activity/migration-strava/jobs/{jobId}:
    get:
      summary: Get Strava migration status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Migration status and progress
  /activity/{id}:
    get:
      summary: Get activities by user id
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Take'
    post:
      summary: Create an activity
      parameters:
        - $ref: '#/components/parameters/Id'
    patch:
      summary: Update an activity
      parameters:
        - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete an activity
      parameters:
        - $ref: '#/components/parameters/Id'
  /activity/{id}/all:
    get:
      summary: Get activities for a user and friends
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Take'
  /activity/activityId/{id}:
    get:
      summary: Get an activity by activity id
      parameters:
        - $ref: '#/components/parameters/Id'
  /comment/{id}:
    get:
      summary: Get comments for an activity
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Take'
    post:
      summary: Create a comment
      parameters:
        - $ref: '#/components/parameters/Id'
    patch:
      summary: Update a comment
      parameters:
        - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete a comment
      parameters:
        - $ref: '#/components/parameters/Id'
  /comment/{id}/count:
    get:
      summary: Get comment count for an activity
      parameters:
        - $ref: '#/components/parameters/Id'
  /comment/{id}/like:
    get:
      summary: Get comment likes
      parameters:
        - $ref: '#/components/parameters/Id'
    post:
      summary: Like a comment
      parameters:
        - $ref: '#/components/parameters/Id'
    delete:
      summary: Delete a comment like
      parameters:
        - $ref: '#/components/parameters/Id'
  /friend/{id}:
    get:
      summary: Get users followed by a user
      parameters:
        - $ref: '#/components/parameters/Id'
    post:
      summary: Follow a user
      parameters:
        - $ref: '#/components/parameters/Id'
    delete:
      summary: Unfollow a user
      parameters:
        - $ref: '#/components/parameters/Id'
  /friend/{id}/followers:
    get:
      summary: Get a user's followers
      parameters:
        - $ref: '#/components/parameters/Id'
  /like:
    post:
      summary: Like an activity
  /like/{id}/{activityId}:
    delete:
      summary: Delete an activity like
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ActivityId'
  /like/{id}:
    get:
      summary: Get likes for an activity
      parameters:
        - $ref: '#/components/parameters/Id'
  /statistics/{id}/year-category:
    get:
      summary: Get yearly statistics by category
      parameters:
        - $ref: '#/components/parameters/Id'
  /statistics/{id}/year-month:
    get:
      summary: Get monthly statistics
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/Month'
  /statistics/{id}/week:
    get:
      summary: Get current week statistics
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/FirstDay'
        - $ref: '#/components/parameters/LastDay'
  /statistics/{id}/all:
    get:
      summary: Get all-time statistics
      parameters:
        - $ref: '#/components/parameters/Id'
  /email/like:
    post:
      summary: Send activity-like notification
  /email/comment:
    post:
      summary: Send comment notification
  /email/commentLike:
    post:
      summary: Send comment-like notification
  /email/feedback:
    post:
      summary: Send feedback with optional S3 media links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedbackId, kind, text, deviceInfo]
              properties:
                feedbackId:
                  type: string
                  format: uuid
                kind:
                  type: string
                text:
                  type: string
                deviceInfo:
                  type: string
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                      thumbnail:
                        type: string
                        format: uri
                        nullable: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
    Take:
      name: take
      in: query
      required: false
      schema:
        type: integer
    Ids:
      name: ids
      in: query
      required: true
      schema:
        type: string
    Year:
      name: year
      in: query
      required: false
      schema:
        type: integer
    Month:
      name: month
      in: query
      required: false
      schema:
        type: integer
    FirstDay:
      name: firstDay
      in: query
      required: false
      schema:
        type: string
    LastDay:
      name: lastDay
      in: query
      required: false
      schema:
        type: string
