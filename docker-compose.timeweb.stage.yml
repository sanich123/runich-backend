name: runich-stage

services:
  db:
    image: postgres:18.6
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'max_connections=50', '-c', 'shared_buffers=128MB']
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - stage-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  db_migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must identify the commit image}
    restart: 'no'
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: ['yarn', 'db:migrate:prod']
    environment:
      TZ: UTC
      APP_ENV: stage
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to db}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  nestjs_app:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must identify the commit image}
    restart: always
    init: true
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    env_file:
      - .env
    command: ['xvfb-run', '--auto-servernum', '--server-args', '-screen 0 1280x1024x24', 'yarn', 'start:prod']
    environment:
      TZ: UTC
      APP_ENV: stage
      RUNICH_PROCESS: api
      OBSERVE_SERVICE_VERSION: ${BACKEND_IMAGE}
      LOG_FILE_PATH: /app/logs.log
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to db}
    volumes:
      - ./logs.log:/app/logs.log
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent --max-time 5 http://127.0.0.1:3000/health/ready >/dev/null']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  background_worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must identify the commit image}
    restart: always
    init: true
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 1.0
    env_file:
      - .env
    command: ['xvfb-run', '--auto-servernum', '--server-args', '-screen 0 1280x1024x24', 'yarn', 'worker:prod']
    environment:
      TZ: UTC
      APP_ENV: stage
      RUNICH_PROCESS: worker
      OBSERVE_SERVICE_VERSION: ${BACKEND_IMAGE}
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to db}

  grafana_alloy:
    image: grafana/alloy:v1.20.1
    restart: always
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      RUNICH_ENV: stage
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:?GRAFANA_LOKI_TOKEN must be set in .env}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/grafana/config.alloy:/etc/alloy/config.alloy:ro
      - grafana_alloy_data:/var/lib/alloy/data

  nginx:
    image: nginx:stable-alpine
    restart: always
    depends_on:
      nestjs_app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.stage.web.d:/etc/nginx/stage-web.d:ro
      - ./web-stage:/var/www/runich-web-stage:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  certbot_renew:
    image: certbot/certbot:latest
    restart: always
    init: true
    pid: service:nginx
    depends_on:
      nginx:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        while true; do
          certbot renew --webroot -w /var/www/certbot
          --deploy-hook "kill -HUP 1" || true;
          sleep 12h;
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  grafana_alloy_data:
  stage-pgdata:
  letsencrypt:
  certbot-webroot:
