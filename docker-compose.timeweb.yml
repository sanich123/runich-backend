services:
  db_migrate:
    image: ${BACKEND_IMAGE:-runich-backend:local}
    restart: 'no'
    init: true
    env_file:
      - .env
    command: ['yarn', 'db:migrate:prod']
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to the external PostgreSQL service}
    volumes:
      - .:/app
      - /app/node_modules

  nestjs_app:
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-runich-backend:local}
    restart: always
    # xvfb-run waits for Xvfb's SIGUSR1; it must run below a real init process,
    # not as PID 1, so the readiness signal is delivered correctly in Docker.
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    env_file:
      - .env
    command: ['xvfb-run', '--auto-servernum', '--server-args', '-screen 0 1280x1024x24', 'yarn', 'start:prod']
    environment:
      TZ: UTC
      RUNICH_PROCESS: api
      LOG_FILE_PATH: /app/logs.log
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to the external PostgreSQL service}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

  background_worker:
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-runich-backend:local}
    restart: always
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 1.0
    env_file:
      - .env
    command: ['xvfb-run', '--auto-servernum', '--server-args', '-screen 0 1280x1024x24', 'yarn', 'worker:prod']
    environment:
      TZ: UTC
      RUNICH_PROCESS: worker
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must point to the external PostgreSQL service}
