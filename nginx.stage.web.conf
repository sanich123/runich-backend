server {
    listen 443 ssl;
    http2 on;
    server_name stage-web.runich-app.ru;

    ssl_certificate /etc/letsencrypt/live/stage-web.runich-app.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage-web.runich-app.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/runich-web-stage/current;
    index index.html;

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ^~ /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|mjs|png|svg|ttf|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
