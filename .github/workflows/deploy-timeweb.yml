name: Deploy to Timeweb

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Deploy exact commit over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is required}"
          : "${GITHUB_TOKEN:?GitHub Actions GITHUB_TOKEN is required}"

          DEPLOY_IMAGE="ghcr.io/sanich123/runich-backend:${GITHUB_SHA}"

          # Build on the GitHub runner instead of the 2 GB production host.
          # The host only pulls the immutable image and starts the services.
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker build --tag "$DEPLOY_IMAGE" .
          docker push "$DEPLOY_IMAGE"
          docker logout ghcr.io >/dev/null

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          printf '%s' "$GITHUB_TOKEN" |
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null && docker pull '$DEPLOY_IMAGE' && docker logout ghcr.io >/dev/null"
          unset GITHUB_TOKEN

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' DEPLOY_IMAGE='$DEPLOY_IMAGE' bash -s" <<'REMOTE'
            set -euo pipefail

            cd /opt/runich-backend/project

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo 'Deployment checkout has tracked changes; refusing to overwrite them.' >&2
              exit 1
            fi

            # This file used to be created manually on the host before it became
            # part of the repository. Preserve that legacy untracked copy so the
            # exact-commit checkout can materialize the tracked version.
            if ! git ls-files --error-unmatch docker-compose.timeweb.yml >/dev/null 2>&1 \
              && [ -f docker-compose.timeweb.yml ]; then
              LEGACY_COMPOSE_BACKUP="/tmp/docker-compose.timeweb.yml.$(date +%s)"
              mv -- docker-compose.timeweb.yml "$LEGACY_COMPOSE_BACKUP"
              echo "Moved legacy untracked compose file to $LEGACY_COMPOSE_BACKUP"
            fi

            git fetch --prune origin master
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            # The immutable image was pulled and verified in the SSH command above.
            # Avoid a second registry request after docker logout; Compose can use
            # the image that is already present on the host.
            BACKEND_IMAGE="$DEPLOY_IMAGE" docker compose \
              -f docker-compose.timeweb.yml up \
              -d --remove-orphans --no-build nestjs_app background_worker

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                http://127.0.0.1:3000/health/live >/dev/null \
                && test "$(docker compose -f docker-compose.timeweb.yml ps --status running --services background_worker)" = \
                  "background_worker"; then
                echo "Deployment is healthy at commit $DEPLOY_SHA"
                # Keep the migration-archive volume intact; PostgreSQL is an
                # external Timeweb DBaaS service and has no Docker volume here.
                # --remove-orphans above removes services retired from Compose;
                # this prune removes their now-unused images and other Docker data.
                docker system prune --all --force || echo 'Docker cleanup failed; keeping the healthy deployment.' >&2
                # The two-stage Dockerfile leaves large, rebuildable BuildKit caches
                # for the development and production dependency installs. Volumes
                # are intentionally not pruned because rebuildable caches are
                # safe to remove, while the migration archive must survive.
                docker builder prune --all --force || echo 'Build cache cleanup failed; keeping the healthy deployment.' >&2
                exit 0
              fi
              sleep 2
            done

            echo 'Health check failed.' >&2
            docker compose -f docker-compose.timeweb.yml ps
            docker compose -f docker-compose.timeweb.yml logs --tail=100 nestjs_app background_worker
            exit 1
          REMOTE
