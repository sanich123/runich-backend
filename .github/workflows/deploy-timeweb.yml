name: Deploy to Timeweb

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCTION_API_URL: https://api.runich-app.ru/health/ready

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Prepare Production image metadata
        run: |
          set -euo pipefail
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          DEPLOY_IMAGE="ghcr.io/sanich123/runich-backend:production-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'TREE_SHA=%s\n' "$TREE_SHA" >> "$GITHUB_ENV"
          printf 'DEPLOY_IMAGE=%s\n' "$DEPLOY_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Production image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: ${{ env.DEPLOY_IMAGE }}
          cache-from: type=gha,scope=runich-backend-production
          cache-to: type=gha,mode=max,scope=runich-backend-production

      - name: Pull and deploy the Production image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is required}"
          : "${GITHUB_TOKEN:?GitHub token is required to pull the private Production image}"
          : "${GRAFANA_LOKI_TOKEN:?GitHub Actions secret GRAFANA_LOKI_TOKEN is required}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$GITHUB_TOKEN" |
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail; umask 077; config_dir=\$(mktemp -d); trap 'rm -rf \"\$config_dir\"' EXIT; DOCKER_CONFIG=\"\$config_dir\" docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; DOCKER_CONFIG=\"\$config_dir\" docker pull '$DEPLOY_IMAGE'"
          unset GITHUB_TOKEN

          printf '%s\n' "$GRAFANA_LOKI_TOKEN" |
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'set -euo pipefail; cd /opt/runich-backend/project; IFS= read -r token; tmp="$(mktemp .env.XXXXXX)"; awk -F= '\''$1 != "GRAFANA_LOKI_TOKEN" { print }'\'' .env > "$tmp"; printf "GRAFANA_LOKI_TOKEN=%s\\n" "$token" >> "$tmp"; chmod --reference=.env "$tmp"; chown --reference=.env "$tmp"; mv "$tmp" .env; unset token; grep -q "^GRAFANA_LOKI_TOKEN=..*" .env'
          unset GRAFANA_LOKI_TOKEN

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/runich-backend/project
            if ! grep -qx 'S3_BUCKET=runich-production' .env; then
              echo 'Production .env must use S3_BUCKET=runich-production before configuring quarantine' >&2
              exit 1
            fi
            quarantine_env="$(mktemp .env.XXXXXX)"
            awk -F= '$1 != "S3_QUARANTINE_BUCKET" && $1 != "S3_QUARANTINE_PREFIX" { print }' .env > "$quarantine_env"
            printf 'S3_QUARANTINE_BUCKET=runich-stage\nS3_QUARANTINE_PREFIX=moderation-quarantine/production/\n' >> "$quarantine_env"
            chmod --reference=.env "$quarantine_env"
            chown --reference=.env "$quarantine_env"
            mv "$quarantine_env" .env
            grep -qx 'S3_QUARANTINE_BUCKET=runich-stage' .env
            grep -qx 'S3_QUARANTINE_PREFIX=moderation-quarantine/production/' .env
          REMOTE

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' DEPLOY_IMAGE='$DEPLOY_IMAGE' DEPLOY_TREE_SHA='$TREE_SHA' bash -s" <<'REMOTE'
            set -euo pipefail

            cd /opt/runich-backend/project

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo 'Deployment checkout has tracked changes; refusing to overwrite them.' >&2
              exit 1
            fi

            git fetch --prune origin master
            git checkout --detach "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$DEPLOY_TREE_SHA"
            test -s .env
            chmod 600 .env
            docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/deployment" "$DEPLOY_IMAGE" \
              node scripts/validate-deployment-env.mjs --environment production --file /deployment/.env
            touch logs.log
            chmod 0644 logs.log

            export BACKEND_IMAGE="$DEPLOY_IMAGE"
            COMPOSE=(docker compose -f docker-compose.timeweb.yml)
            "${COMPOSE[@]}" config --quiet
            "${COMPOSE[@]}" pull nginx certbot certbot_renew

            test -s /opt/runich-web-production/current/index.html
            for certificate_domain in api.runich-app.ru runich-app.ru; do
              openssl x509 -in "/etc/letsencrypt/live/$certificate_domain/fullchain.pem" \
                -checkend 0 -noout
              "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps --entrypoint sh certbot \
                -c 'test -s "/etc/letsencrypt/live/$1/fullchain.pem" && test -s "/etc/letsencrypt/live/$1/privkey.pem"' \
                sh "$certificate_domain"
            done

            if ! "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps nginx nginx -V 2>&1 \
              | grep -q -- '--with-http_v3_module'; then
              echo 'The Production Nginx image does not include the HTTP/3 module.' >&2
              exit 1
            fi
            "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps nginx nginx -t

            # Запускаем ту же задачу миграции, что и на Stage, до замены любого из процессов.
            BACKEND_IMAGE="$DEPLOY_IMAGE" "${COMPOSE[@]}" \
              up --no-build --force-recreate \
              --abort-on-container-exit --exit-code-from db_migrate db_migrate
            BACKEND_IMAGE="$DEPLOY_IMAGE" "${COMPOSE[@]}" up \
              -d --force-recreate --remove-orphans --no-build nestjs_app background_worker

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                http://127.0.0.1:3000/health/ready >/dev/null \
                && test "$(docker compose -f docker-compose.timeweb.yml ps --status running --services background_worker)" = \
                  "background_worker"; then
                # Контейнеры обслуживают TCP/UDP 443 и обновляют сертификаты.
                "${COMPOSE[@]}" up \
                  -d --force-recreate nginx certbot_renew

                for ingress_attempt in $(seq 1 30); do
                  if curl --fail --silent --show-error --max-time 5 \
                    --resolve api.runich-app.ru:443:127.0.0.1 \
                    https://api.runich-app.ru/health/ready >/dev/null \
                    && curl --fail --silent --show-error --max-time 5 \
                      --resolve runich-app.ru:443:127.0.0.1 \
                      https://runich-app.ru/ >/dev/null; then
                    break
                  fi
                  if [ "$ingress_attempt" -eq 30 ]; then
                    echo 'Production Docker Nginx HTTPS readiness failed.' >&2
                    "${COMPOSE[@]}" ps
                    "${COMPOSE[@]}" logs --tail=100 nginx
                    exit 1
                  fi
                  sleep 2
                done

                if ! curl --silent --show-error --max-time 10 -D - -o /dev/null \
                  --resolve api.runich-app.ru:443:127.0.0.1 \
                  https://api.runich-app.ru/health/ready \
                  | grep -iq '^alt-svc:.*h3='; then
                  echo 'Production API does not advertise HTTP/3.' >&2
                  exit 1
                fi
                if ! curl --silent --show-error --max-time 10 -D - -o /dev/null \
                  --resolve runich-app.ru:443:127.0.0.1 https://runich-app.ru/ \
                  | grep -iq '^alt-svc:.*h3='; then
                  echo 'Production web does not advertise HTTP/3.' >&2
                  exit 1
                fi

                "${COMPOSE[@]}" up \
                  -d --no-deps --force-recreate grafana_alloy
                alloy_running=false
                for alloy_attempt in $(seq 1 15); do
                  if test "$(docker compose -f docker-compose.timeweb.yml ps --status running --services grafana_alloy)" = \
                    "grafana_alloy"; then
                    alloy_running=true
                    break
                  fi
                  sleep 1
                done
                if [ "$alloy_running" != true ]; then
                  echo 'Grafana Alloy failed to reach running state.' >&2
                  exit 1
                fi
                printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
                echo "Production is ready at commit $DEPLOY_SHA using image $DEPLOY_IMAGE"
                exit 0
              fi
              sleep 2
            done

            echo 'Health check failed.' >&2
            docker compose -f docker-compose.timeweb.yml ps
            docker compose -f docker-compose.timeweb.yml logs --tail=100 nestjs_app background_worker
            exit 1
          REMOTE

      - name: Verify production HTTPS readiness
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$PRODUCTION_API_URL" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Production HTTPS readiness failed: $PRODUCTION_API_URL" >&2
            exit 1
          fi
          if ! curl --silent --show-error --max-time 10 -D - -o /dev/null "$PRODUCTION_API_URL" \
            | grep -iq '^alt-svc:.*h3='; then
            echo 'Production API does not advertise HTTP/3.' >&2
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 10 https://runich-app.ru/ >/dev/null; then
            echo 'Production web HTTPS readiness failed.' >&2
            exit 1
          fi
          if ! curl --silent --show-error --max-time 10 -D - -o /dev/null https://runich-app.ru/ \
            | grep -iq '^alt-svc:.*h3='; then
            echo 'Production web does not advertise HTTP/3.' >&2
            exit 1
          fi
          echo 'Production API and web HTTPS/HTTP/3 advertisement checks passed.'

      - name: Send deployment success email from Production server
        id: send_success_email
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is required}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          unset DEPLOY_SSH_KEY

          DEPLOY_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' DEPLOY_RUN_URL='$DEPLOY_RUN_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/runich-backend/project
          running_container="$(docker compose -f docker-compose.timeweb.yml ps -q nestjs_app)"
          test -n "$running_container"
          DEPLOY_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$running_container")"
          export BACKEND_IMAGE="$DEPLOY_IMAGE"
          TLS_CERTIFICATE_EXPIRY=''
          for certificate_domain in api.runich-app.ru runich-app.ru; do
            certificate_path="/etc/letsencrypt/live/$certificate_domain/fullchain.pem"
            certificate_expiry="$(openssl x509 -in "$certificate_path" -noout -enddate | sed 's/^notAfter=//')"
            if [ -z "$certificate_expiry" ]; then
              echo "Could not read the expiry date for $certificate_domain." >&2
              exit 1
            fi
            TLS_CERTIFICATE_EXPIRY+="$certificate_domain: $certificate_expiry"
            TLS_CERTIFICATE_EXPIRY+=$'\n'
          done
          export TLS_CERTIFICATE_EXPIRY
          DEPLOY_ENV_REPORT="$(docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/deployment:ro" "$DEPLOY_IMAGE" \
            node scripts/summarize-deployment-env.mjs --file /deployment/.env | paste -sd, -)"
          export DEPLOY_ENV_REPORT
          docker compose -f docker-compose.timeweb.yml exec -T \
            --env DEPLOY_SHA --env DEPLOY_RUN_URL --env DEPLOY_ENV_REPORT --env TLS_CERTIFICATE_EXPIRY \
            nestjs_app xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            node scripts/send-deployment-success-email.mjs
          REMOTE

      - name: Clean up Production Docker resources after notification
        if: ${{ always() && steps.send_success_email.outcome != 'skipped' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?GitHub Secret DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?GitHub Secret DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?GitHub Secret DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?GitHub Secret DEPLOY_KNOWN_HOSTS is required}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          unset DEPLOY_SSH_KEY

          # Этот шаг запускается после отправки письма, даже если скрипт сообщил об ошибке.
          # Очистка выполняется по возможности; внешняя база и тома Docker не удаляются.
          if ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/runich-backend/project

          echo 'Docker disk usage before cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage before cleanup.' >&2
          docker container prune --force --filter 'until=48h' || echo 'Stopped-container cleanup failed; keeping the healthy deployment.' >&2
          docker image prune --all --force --filter 'until=48h' || echo 'Image cleanup failed; keeping the healthy deployment.' >&2
          docker network prune --force --filter 'until=48h' || echo 'Network cleanup failed; keeping the healthy deployment.' >&2
          docker builder prune --all --force --filter 'until=48h' || echo 'Build cache cleanup failed; keeping the healthy deployment.' >&2
          echo 'Docker disk usage after cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage after cleanup.' >&2
          REMOTE
          then
            echo 'Production Docker cleanup finished after notification.'
          else
            echo 'Production Docker cleanup could not be run; deployment remains healthy.' >&2
          fi
