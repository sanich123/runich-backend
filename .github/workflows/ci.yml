name: Backend CI

on:
  push:
    branches: [master, stage]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://runich:runich@localhost:5432/runich_db?schema=public
  JWT_SECRET: ci-test-secret
  NODE_ENV: test
  SEED_MOCK_DATA: 'false'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: runich
          POSTGRES_PASSWORD: runich
          POSTGRES_DB: runich_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runich -d runich_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma Client
        run: yarn prisma generate

      - name: Apply database migrations
        run: yarn migrate

      - name: Typecheck
        run: yarn typecheck

      - name: ESLint
        run: yarn eslint src integration

      - name: Build application
        run: yarn build

      - name: Unit tests
        run: yarn test:ci

      - name: Coverage thresholds
        run: yarn test:cov

      - name: PostgreSQL integration/e2e tests
        run: yarn test:integration

      - name: Check circular dependencies
        run: yarn madge

      - name: Build Docker image
        run: docker build --tag runich-backend:ci .

      - name: Verify Docker image metadata
        run: docker image inspect runich-backend:ci >/dev/null
