name: Deploy stage to Timeweb

on:
  push:
    branches:
      - stage

concurrency:
  group: runich-stage-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy exact stage commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: stage
      url: https://stage.runich-app.ru
    env:
      STAGE_DOMAIN: stage.runich-app.ru
      STAGE_WEB_DOMAIN: stage-web.runich-app.ru
      DEPLOY_IMAGE: ghcr.io/sanich123/runich-backend:stage-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Build and publish immutable image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker build --pull --tag "$DEPLOY_IMAGE" .
          docker push "$DEPLOY_IMAGE"
          docker logout ghcr.io >/dev/null

      - name: Deploy the exact image over SSH
        env:
          STAGE_DEPLOY_HOST: ${{ secrets.STAGE_DEPLOY_HOST }}
          STAGE_DEPLOY_USER: runich-deploy
          STAGE_DEPLOY_SSH_KEY: ${{ secrets.STAGE_DEPLOY_SSH_KEY }}
          STAGE_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGE_DEPLOY_KNOWN_HOSTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
        run: |
          set -euo pipefail

          : "${STAGE_DEPLOY_HOST:?GitHub Actions secret STAGE_DEPLOY_HOST is required}"
          : "${STAGE_DEPLOY_USER:?STAGE_DEPLOY_USER must be set}"
          : "${STAGE_DEPLOY_SSH_KEY:?GitHub Actions secret STAGE_DEPLOY_SSH_KEY is required}"
          : "${STAGE_DEPLOY_KNOWN_HOSTS:?GitHub Actions secret STAGE_DEPLOY_KNOWN_HOSTS is required}"
          : "${GITHUB_TOKEN:?GitHub token is required to pull the private Stage image}"
          : "${GRAFANA_LOKI_TOKEN:?GitHub Actions secret GRAFANA_LOKI_TOKEN is required}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGE_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGE_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          # Keep the connection alive while remote image pulls can go quiet for minutes.
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120)
          SCP=(scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120)
          TARGET="$STAGE_DEPLOY_USER@$STAGE_DEPLOY_HOST"
          DEPLOY_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Keep the Loki token in the encrypted repository secret and server
          # .env. Transfer it through SSH stdin, not process arguments.
          printf '%s\n' "$GRAFANA_LOKI_TOKEN" |
            "${SSH[@]}" "$TARGET" 'set -eu; cd /opt/runich-stage; umask 077; IFS= read -r token; tmp="$(mktemp .env.XXXXXX)"; sed "/^GRAFANA_LOKI_TOKEN=/d" .env > "$tmp"; printf "GRAFANA_LOKI_TOKEN=%s\\n" "$token" >> "$tmp"; chmod --reference=.env "$tmp"; chown --reference=.env "$tmp"; mv "$tmp" .env; unset token'
          unset GRAFANA_LOKI_TOKEN

          # The Stage host has limited disk space. Remove unused Docker objects
          # before streaming the new image; named database and certificate volumes
          # are preserved because this prune does not include --volumes.
          "${SSH[@]}" "$TARGET" 'set -euo pipefail; echo "Disk before Docker cleanup:"; df -h /; docker system df; docker system prune --all --force; echo "Disk after Docker cleanup:"; df -h /; docker system df'

          # Pull the exact immutable image from GHCR on the Stage server. The job token
          # travels over SSH stdin, and the temporary Docker credentials are removed
          # when the pull command exits.
          printf '%s\n' "$GITHUB_TOKEN" |
            "${SSH[@]}" "$TARGET" \
              "set -euo pipefail; umask 077; config_dir=\$(mktemp -d); trap 'rm -rf \"\$config_dir\"' EXIT; DOCKER_CONFIG=\"\$config_dir\" docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; DOCKER_CONFIG=\"\$config_dir\" docker pull '$DEPLOY_IMAGE'"
          unset GITHUB_TOKEN
          unset STAGE_DEPLOY_SSH_KEY

          "${SCP[@]}" docker-compose.timeweb.stage.yml nginx.stage.bootstrap.conf deploy/nginx/runich.conf.template deploy/grafana/config.alloy "$TARGET:/tmp/"

          "${SSH[@]}" "$TARGET" "DEPLOY_IMAGE='$DEPLOY_IMAGE' STAGE_DOMAIN='$STAGE_DOMAIN' STAGE_WEB_DOMAIN='$STAGE_WEB_DOMAIN' DEPLOY_SHA='$GITHUB_SHA' DEPLOY_RUN_URL='$DEPLOY_RUN_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/runich-stage

          test -s .env
          chmod 600 .env
          set_auth_frontend_redirect() {
            file="$1"
            tmp="$(mktemp .env.XXXXXX)"
            awk -F= '$1 != "AUTH_FRONTEND_REDIRECT_URI" { print }' "$file" > "$tmp"
            printf 'AUTH_FRONTEND_REDIRECT_URI=https://stage-web.runich-app.ru/login-from-url\n' >> "$tmp"
            chmod --reference="$file" "$tmp"
            chown --reference="$file" "$tmp"
            mv "$tmp" "$file"
          }
          set_auth_frontend_redirect .env
          if [ -f app.env ]; then
            set_auth_frontend_redirect app.env
          fi
          if [ -f app.env ]; then
            chmod 600 app.env
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "$PWD:/deployment" "$DEPLOY_IMAGE" \
              node scripts/validate-deployment-env.mjs \
              --environment stage --file /deployment/.env --merge-legacy /deployment/app.env
          else
            docker run --rm --user "$(id -u):$(id -g)" \
              --volume "$PWD:/deployment" "$DEPLOY_IMAGE" \
              node scripts/validate-deployment-env.mjs --environment stage --file /deployment/.env
          fi
          install -o "$(id -un)" -g docker -m 0640 /tmp/docker-compose.timeweb.stage.yml ./docker-compose.timeweb.stage.yml
          install -o "$(id -un)" -g docker -m 0644 /tmp/nginx.stage.bootstrap.conf ./nginx.stage.bootstrap.conf
          install -d -o "$(id -un)" -g docker -m 0750 ./deploy/nginx
          install -o "$(id -un)" -g docker -m 0644 /tmp/runich.conf.template ./deploy/nginx/runich.conf.template
          install -d -o "$(id -un)" -g docker -m 0755 ./web-stage/releases
          chmod 0755 ./web-stage ./web-stage/releases
          install -d -o "$(id -un)" -g docker -m 0755 ./certbot-webroot
          install -d -o "$(id -un)" -g docker -m 0750 ./deploy/grafana
          install -o "$(id -un)" -g docker -m 0644 /tmp/config.alloy ./deploy/grafana/config.alloy
          touch logs.log
          chmod 0644 logs.log
          rm -f /tmp/docker-compose.timeweb.stage.yml /tmp/nginx.stage.bootstrap.conf /tmp/runich.conf.template /tmp/config.alloy

          export BACKEND_IMAGE="$DEPLOY_IMAGE"
          COMPOSE=(docker compose --project-name runich-stage -f docker-compose.timeweb.stage.yml)
          BOOTSTRAP_COMPOSE=(docker compose --project-name runich-stage --profile bootstrap -f docker-compose.timeweb.stage.yml)
          bootstrap_active=false
          stop_bootstrap_on_exit() {
            if [ "$bootstrap_active" = true ]; then
              "${BOOTSTRAP_COMPOSE[@]}" stop nginx_bootstrap || true
            fi
          }
          trap stop_bootstrap_on_exit EXIT

          "${COMPOSE[@]}" config --quiet
          "${COMPOSE[@]}" pull db nginx certbot certbot_renew
          "${COMPOSE[@]}" up -d --wait db
          "${COMPOSE[@]}" up --force-recreate --abort-on-container-exit \
            --exit-code-from db_migrate db_migrate
          "${COMPOSE[@]}" up -d --force-recreate --remove-orphans nestjs_app background_worker

          if ! "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps nginx nginx -V 2>&1 \
            | grep -q -- '--with-http_v3_module'; then
            echo 'The Stage Nginx image does not include the HTTP/3 module.' >&2
            exit 1
          fi

          certificates_ready=true
          for certificate_domain in "$STAGE_DOMAIN" "$STAGE_WEB_DOMAIN"; do
            if ! "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps --entrypoint sh certbot \
              -c 'test -s "/etc/letsencrypt/live/$1/fullchain.pem" && test -s "/etc/letsencrypt/live/$1/privkey.pem"' \
              sh "$certificate_domain" </dev/null; then
              certificates_ready=false
            fi
          done

          if [ "$certificates_ready" != true ]; then
            "${COMPOSE[@]}" stop nginx || true
            "${BOOTSTRAP_COMPOSE[@]}" up -d --force-recreate nginx_bootstrap
            bootstrap_active=true
            for certificate_domain in "$STAGE_DOMAIN" "$STAGE_WEB_DOMAIN"; do
              if ! "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps --entrypoint sh certbot \
                -c 'test -s "/etc/letsencrypt/live/$1/fullchain.pem" && test -s "/etc/letsencrypt/live/$1/privkey.pem"' \
                sh "$certificate_domain" </dev/null; then
                "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps certbot \
                  certonly --webroot --webroot-path /var/www/certbot \
                  --domain "$certificate_domain" --cert-name "$certificate_domain" \
                  --non-interactive --agree-tos --register-unsafely-without-email </dev/null
              fi
            done
            "${BOOTSTRAP_COMPOSE[@]}" stop nginx_bootstrap
            bootstrap_active=false
            "${BOOTSTRAP_COMPOSE[@]}" rm -f nginx_bootstrap
          fi

          "${COMPOSE[@]}" run --rm -T --interactive=false --no-deps nginx nginx -t
          "${COMPOSE[@]}" up -d --force-recreate --remove-orphans nginx

          "${COMPOSE[@]}" up -d --force-recreate certbot_renew

          healthy=false
          for attempt in $(seq 1 30); do
            if "${COMPOSE[@]}" exec -T nestjs_app </dev/null \
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health/ready >/dev/null \
              && [ "$("${COMPOSE[@]}" ps --status running --services background_worker)" = background_worker ]; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo 'Stage API readiness failed.' >&2
            exit 1
          fi

          "${COMPOSE[@]}" up -d --no-deps --force-recreate grafana_alloy
          alloy_running=false
          for attempt in $(seq 1 15); do
            if [ "$("${COMPOSE[@]}" ps --status running --services grafana_alloy)" = grafana_alloy ]; then
              alloy_running=true
              break
            fi
            sleep 1
          done
          if [ "$alloy_running" != true ]; then
            echo 'Grafana Alloy failed to reach running state.' >&2
            exit 1
          fi

          if ! curl --fail --silent --show-error --max-time 10 \
            --resolve "$STAGE_DOMAIN:443:127.0.0.1" "https://$STAGE_DOMAIN/health/ready" >/dev/null; then
            echo 'Stage HTTPS readiness failed.' >&2
            exit 1
          fi

          if ! curl --silent --show-error --max-time 10 -D - -o /dev/null \
            --resolve "$STAGE_DOMAIN:443:127.0.0.1" "https://$STAGE_DOMAIN/health/ready" \
            | grep -i '^alt-svc:.*h3=' >/dev/null; then
            echo 'Stage API does not advertise HTTP/3.' >&2
            exit 1
          fi

          if ! curl --silent --show-error --max-time 10 \
            --resolve "$STAGE_WEB_DOMAIN:443:127.0.0.1" "https://$STAGE_WEB_DOMAIN/" >/dev/null; then
            echo 'Stage web HTTPS certificate/route check failed.' >&2
            exit 1
          fi

          if ! curl --silent --show-error --max-time 10 -D - -o /dev/null \
            --resolve "$STAGE_WEB_DOMAIN:443:127.0.0.1" "https://$STAGE_WEB_DOMAIN/" \
            | grep -i '^alt-svc:.*h3=' >/dev/null; then
            echo 'Stage web does not advertise HTTP/3.' >&2
            exit 1
          fi

          if [ -f app.env ]; then
            rm -f app.env
            echo 'Removed the retired Stage app.env after the unified .env passed readiness.'
          fi

          printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
          echo "Stage is healthy at commit $DEPLOY_SHA"

          TLS_CERTIFICATE_EXPIRY=''
          for certificate_domain in "$STAGE_DOMAIN" "$STAGE_WEB_DOMAIN"; do
            certificate_output="$("${COMPOSE[@]}" run --rm -T --interactive=false --no-deps certbot \
              certificates --cert-name "$certificate_domain")"
            certificate_expiry="$(printf '%s\n' "$certificate_output" \
              | sed -nE 's/^[[:space:]]*Expiry Date: (.*) \(VALID:.*\)$/\1/p' | head -n 1)"
            if [ -z "$certificate_expiry" ]; then
              echo "Could not read the expiry date for $certificate_domain." >&2
              exit 1
            fi
            TLS_CERTIFICATE_EXPIRY+="$certificate_domain: $certificate_expiry"
            TLS_CERTIFICATE_EXPIRY+=$'\n'
          done
          export TLS_CERTIFICATE_EXPIRY

          DEPLOY_ENV_REPORT="$(docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/deployment:ro" "$DEPLOY_IMAGE" \
            node scripts/summarize-deployment-env.mjs --file /deployment/.env | paste -sd, -)"
          export DEPLOY_ENV_REPORT

          email_status=0
          if "${COMPOSE[@]}" exec -T --interactive=false \
            --env DEPLOY_SHA --env DEPLOY_RUN_URL --env DEPLOY_ENV_REPORT --env TLS_CERTIFICATE_EXPIRY \
            nestjs_app xvfb-run --auto-servernum \
            --server-args '-screen 0 1280x1024x24' \
            node scripts/send-deployment-success-email.mjs </dev/null; then
            echo 'Stage deployment success email sent.'
          else
            email_status=$?
            echo 'Stage deployment success email failed; continuing with cleanup.' >&2
          fi

          # The stage host has limited disk space. Keep active containers and
          # all named volumes (PostgreSQL and Let's Encrypt), but remove old
          # images, stopped containers, unused networks, and build cache only
          # after deployment readiness checks and the email attempt.
          echo 'Docker disk usage before cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage before cleanup.' >&2
          docker system prune --all --force || \
            echo 'Docker cleanup failed; keeping the healthy deployment.' >&2
          echo 'Docker disk usage after cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage after cleanup.' >&2

          if [ "$email_status" -ne 0 ]; then
            exit "$email_status"
          fi
          REMOTE
