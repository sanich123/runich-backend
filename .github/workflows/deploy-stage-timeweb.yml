name: Deploy stage to Timeweb

on:
  push:
    branches:
      - stage

concurrency:
  group: runich-stage-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy exact stage commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: stage
      url: https://stage.runich-app.ru
    env:
      STAGE_DOMAIN: stage.runich-app.ru
      DEPLOY_IMAGE: ghcr.io/sanich123/runich-backend:${{ github.sha }}

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Build and publish immutable image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker build --pull --tag "$DEPLOY_IMAGE" .
          docker push "$DEPLOY_IMAGE"
          docker logout ghcr.io >/dev/null

      - name: Deploy the exact image over SSH
        env:
          STAGE_DEPLOY_HOST: ${{ secrets.STAGE_DEPLOY_HOST }}
          STAGE_DEPLOY_USER: runich-deploy
          STAGE_DEPLOY_SSH_KEY: ${{ secrets.STAGE_DEPLOY_SSH_KEY }}
          STAGE_DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGE_DEPLOY_KNOWN_HOSTS }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
        run: |
          set -euo pipefail

          : "${STAGE_DEPLOY_HOST:?GitHub Actions secret STAGE_DEPLOY_HOST is required}"
          : "${STAGE_DEPLOY_USER:?STAGE_DEPLOY_USER must be set}"
          : "${STAGE_DEPLOY_SSH_KEY:?GitHub Actions secret STAGE_DEPLOY_SSH_KEY is required}"
          : "${STAGE_DEPLOY_KNOWN_HOSTS:?GitHub Actions secret STAGE_DEPLOY_KNOWN_HOSTS is required}"
          : "${GRAFANA_LOKI_TOKEN:?GitHub Actions secret GRAFANA_LOKI_TOKEN is required}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGE_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGE_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          TARGET="$STAGE_DEPLOY_USER@$STAGE_DEPLOY_HOST"

          # Keep the Loki token in the encrypted repository secret and server
          # .env. Transfer it through SSH stdin, not process arguments.
          printf '%s\n' "$GRAFANA_LOKI_TOKEN" |
            "${SSH[@]}" "$TARGET" 'set -eu; cd /opt/runich-stage; umask 077; IFS= read -r token; tmp="$(mktemp .env.XXXXXX)"; sed "/^GRAFANA_LOKI_TOKEN=/d" .env > "$tmp"; printf "GRAFANA_LOKI_TOKEN=%s\\n" "$token" >> "$tmp"; chmod --reference=.env "$tmp"; chown --reference=.env "$tmp"; mv "$tmp" .env; unset token'
          unset GRAFANA_LOKI_TOKEN

          # Stream the already-built image over the pinned SSH connection. This avoids
          # storing a registry credential on the server or making the package public.
          docker save "$DEPLOY_IMAGE" | gzip -1 | "${SSH[@]}" "$TARGET" 'gzip -d | docker load'
          unset STAGE_DEPLOY_SSH_KEY

          "${SCP[@]}" docker-compose.timeweb.stage.yml nginx.stage.bootstrap.conf nginx.stage.conf deploy/grafana/config.alloy "$TARGET:/tmp/"

          "${SSH[@]}" "$TARGET" "DEPLOY_IMAGE='$DEPLOY_IMAGE' STAGE_DOMAIN='$STAGE_DOMAIN' DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/runich-stage

          test -s .env
          test -s app.env
          chmod 600 .env app.env
          install -o "$(id -un)" -g docker -m 0640 /tmp/docker-compose.timeweb.stage.yml ./docker-compose.timeweb.stage.yml
          install -o "$(id -un)" -g docker -m 0644 /tmp/nginx.stage.bootstrap.conf ./nginx.stage.bootstrap.conf
          install -o "$(id -un)" -g docker -m 0644 /tmp/nginx.stage.conf ./nginx.stage.tls.conf
          install -d -o "$(id -un)" -g docker -m 0750 ./deploy/grafana
          install -o "$(id -un)" -g docker -m 0644 /tmp/config.alloy ./deploy/grafana/config.alloy
          rm -f /tmp/docker-compose.timeweb.stage.yml /tmp/nginx.stage.bootstrap.conf /tmp/nginx.stage.conf /tmp/config.alloy

          export BACKEND_IMAGE="$DEPLOY_IMAGE"
          COMPOSE=(docker compose --project-name runich-stage -f docker-compose.timeweb.stage.yml)

          "${COMPOSE[@]}" pull db nginx certbot certbot_renew
          "${COMPOSE[@]}" up -d --wait db
          # Prisma 8 changed the storage representation of the same schema.
          # Repair a legacy stage marker only after db sign confirms that the
          # live schema already matches the current contract; real schema drift
          # still fails here and must go through the migration graph.
          "${COMPOSE[@]}" run --rm --no-TTY --interactive=false db_migrate \
            sh -lc 'yarn prisma db sign --db "$DATABASE_URL" --no-advance-ref' </dev/null
          "${COMPOSE[@]}" run --rm --no-TTY --interactive=false db_migrate </dev/null
          "${COMPOSE[@]}" up -d --force-recreate --remove-orphans nestjs_app background_worker

          if [ -s .stage-cert-ready ]; then
            install -o "$(id -un)" -g docker -m 0644 ./nginx.stage.tls.conf ./nginx.active.conf
          else
            install -o "$(id -un)" -g docker -m 0644 ./nginx.stage.bootstrap.conf ./nginx.active.conf
          fi

          "${COMPOSE[@]}" up -d --force-recreate nginx

          if [ ! -s .stage-cert-ready ]; then
            "${COMPOSE[@]}" run --rm --no-TTY --interactive=false --no-deps certbot \
              certonly --webroot --webroot-path /var/www/certbot \
              --domain "$STAGE_DOMAIN" --cert-name "$STAGE_DOMAIN" \
              --non-interactive --agree-tos --register-unsafely-without-email </dev/null
            install -o "$(id -un)" -g docker -m 0644 ./nginx.stage.tls.conf ./nginx.active.conf
            "${COMPOSE[@]}" up -d --force-recreate nginx
            touch .stage-cert-ready
          fi

          "${COMPOSE[@]}" up -d --force-recreate certbot_renew

          healthy=false
          for attempt in $(seq 1 30); do
            if "${COMPOSE[@]}" exec -T nestjs_app </dev/null \
              curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health/ready >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo 'Stage API readiness failed.' >&2
            exit 1
          fi

          "${COMPOSE[@]}" up -d --no-deps --force-recreate grafana_alloy
          alloy_running=false
          for attempt in $(seq 1 15); do
            if [ "$("${COMPOSE[@]}" ps --status running --services grafana_alloy)" = grafana_alloy ]; then
              alloy_running=true
              break
            fi
            sleep 1
          done
          if [ "$alloy_running" != true ]; then
            echo 'Grafana Alloy failed to reach running state.' >&2
            exit 1
          fi

          if ! curl --fail --silent --show-error --max-time 10 \
            --resolve "$STAGE_DOMAIN:443:127.0.0.1" "https://$STAGE_DOMAIN/health/ready" >/dev/null; then
            echo 'Stage HTTPS readiness failed.' >&2
            exit 1
          fi

          printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
          echo "Stage is healthy at commit $DEPLOY_SHA"

          # The stage host has limited disk space. Keep active containers and
          # all named volumes (PostgreSQL and Let's Encrypt), but remove old
          # images, stopped containers, unused networks, and build cache only
          # after every deployment health check has passed.
          echo 'Docker disk usage before cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage before cleanup.' >&2
          docker system prune --all --force || \
            echo 'Docker cleanup failed; keeping the healthy deployment.' >&2
          echo 'Docker disk usage after cleanup:'
          docker system df || echo 'Could not inspect Docker disk usage after cleanup.' >&2
          REMOTE
