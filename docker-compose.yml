services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: runich
      POSTGRES_PASSWORD: HfG3@fj0OfjvHdkf234ja
      POSTGRES_DB: runich_db
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'

  nestjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://runich:HfG3%40fj0OfjvHdkf234ja@db:5432/runich_db?schema=public
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
