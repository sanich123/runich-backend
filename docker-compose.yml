services:
  db:
    image: postgres:18.6
    command: ['postgres', '-c', 'timezone=UTC']
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runich}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or the shell}
      POSTGRES_DB: ${POSTGRES_DB:-runich_db}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  nestjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-runich-backend:local}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: UTC
      RUNICH_PROCESS: api
      LOG_FILE_PATH: /app/logs.log
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env or the shell}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules

  background_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-runich-backend:local}
    command: ['yarn', 'worker:prod']
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 0.50
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: UTC
      RUNICH_PROCESS: worker
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env or the shell}

volumes:
  pgdata:
