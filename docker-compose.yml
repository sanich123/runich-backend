services:
  db:
    image: postgres:18.6
    command: ['postgres', '-c', 'timezone=UTC']
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runich}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or the shell}
      POSTGRES_DB: ${POSTGRES_DB:-runich_db}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  nestjs_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env or the shell}
      MIGRATION_ARCHIVE_DIRECTORY: /var/lib/runich/migration-archives
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - migration_archives:/var/lib/runich/migration-archives

  activity_migration_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['yarn', 'start:migration-worker:prod']
    restart: always
    cpus: ${MIGRATION_WORKER_CPUS:-0.50}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env or the shell}
      MIGRATION_ARCHIVE_DIRECTORY: /var/lib/runich/migration-archives
    volumes:
      - migration_archives:/var/lib/runich/migration-archives

volumes:
  pgdata:
  migration_archives:
